[package]
name = "screen"
version = "0.1.0"
edition = "2021"
description = "A display, app or window of this machine as a live pane that agents can open and steer."
license = "MIT"
repository = "https://github.com/pointman-ai/pointman-screen"
publish = false

[dependencies]
anyhow = "1"
libc = "0.2"
pointman-extension = { git = "https://github.com/pointman-ai/pointman-extension", rev = "2ccde7428755e90f3226422c6af45536e4874ff3" }
serde_json = "1"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
core-graphics = "0.25"

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
lto = true
