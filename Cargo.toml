[package]
name = "screen"
version = "0.5.0"
edition = "2021"
description = "A display, app or window of this machine as a live pane that agents can open and steer."
license = "MIT"
repository = "https://github.com/pointman-ai/pointman-screen"
publish = false

[dependencies]
anyhow = "1"
libc = "0.2"
pointman-extension = { git = "https://github.com/pointman-ai/pointman-extension", tag = "v0.5.0" }
serde_json = "1"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
core-foundation = "0.10"
core-graphics = { version = "0.25", features = ["highsierra"] }
dispatch2 = "0.3"
objc2 = "0.6"
objc2-core-foundation = "0.3"
objc2-core-media = "0.3"
objc2-core-video = "0.3"
objc2-foundation = "0.3"
objc2-screen-capture-kit = "0.3"

[dev-dependencies]
tempfile = "3"
toml = "1"

[profile.release]
strip = true
lto = true
